[package]
name = "phototool-desktop"
version = "1.1.0"
description = "PhotoTool desktop shell"
authors = ["PhotoTool"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Controls_Dialogs"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
